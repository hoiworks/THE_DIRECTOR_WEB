<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080909" />
    <meta name="description" content="YOU ARE THE DIRECTOR. Choose a world." />
    <title>THE DIRECTOR</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="stage" data-state="PROLOGUE" aria-label="THE DIRECTOR interactive invitation">
      <img class="hold" src="assets/STUDIO_HOLD.png" alt="A director's chair in a film studio" decoding="async" fetchpriority="high" />
      <video class="film intro" src="assets/INTRO.mp4" playsinline webkit-playsinline muted preload="auto" disablepictureinpicture aria-label="Film studio introduction"></video>
      <video class="film branch" playsinline webkit-playsinline muted preload="none" disablepictureinpicture aria-label="Chosen transformation"></video>
      <div class="spatial-reaction" aria-hidden="true"></div>
      <div class="cinematic-black" aria-hidden="true"></div>

      <button class="sound-control" type="button" aria-label="Turn sound off" aria-pressed="true">SOUND ON</button>

      <section class="prologue" aria-label="THE DIRECTOR prologue">
        <div class="prologue-shade" aria-hidden="true"></div>
        <button class="prologue-enter" type="button">ACCEPT INVITATION</button>
        <p class="prologue-status" role="status" aria-live="polite" hidden></p>
      </section>

      <div class="start-layer" hidden>
        <button class="start-button" type="button">START</button>
      </div>

      <div class="choice-layer" hidden>
        <div class="choice-buttons" role="group" aria-label="Choose a world">
          <p class="choice-prompt">DIRECT YOUR WORLD</p>
          <p class="choice-story">YOUR CHOICE CHANGES THE STORY.</p>
          <button class="choice-button" type="button" data-choice="ICE">FREEZE</button>
          <button class="choice-button" type="button" data-choice="NATURE">AWAKEN</button>
        </div>
      </div>

      <p class="loading" role="status" aria-live="polite" hidden>LOADING</p>
      <p class="message" role="alert" hidden></p>

      <div class="ending-layer" hidden>
        <h1 class="ending-title">THE DIRECTOR</h1>
        <p class="ending-message" aria-label="YOU ARE THE DIRECTOR.">YOU ARE THE<br />DIRECTOR.</p>
        <div class="ending-actions" hidden>
          <button class="ending-button enter-button" type="button">ENTER</button>
          <div class="ending-secondary">
            <button class="ending-button replay-button" type="button">REPLAY</button>
            <button class="ending-button choose-again-button" type="button">CHOOSE AGAIN</button>
          </div>
        </div>
      </div>

      <section class="invitation" aria-labelledby="invitation-title" hidden>
        <div class="invitation-content">
          <p class="invitation-kicker">H3 CINEMATIC STORY LAB</p>
          <h2 id="invitation-title" tabindex="-1">YOUR STORY.<br />YOUR DIRECTION.</h2>
          <div class="invitation-rule" aria-hidden="true"></div>
          <p class="invitation-copy" lang="ko">상상에서 한 편의 시네마틱 작품까지.<br />AI와 함께 자신만의 이야기를 연출하는 창작 경험.</p>
          <p class="invitation-themes">STORY · CHARACTER · CAMERA · CINEMA</p>
          <button class="invitation-back" type="button">BACK TO EXPERIENCE</button>
        </div>
      </section>
    </main>
  </body>
</html>
